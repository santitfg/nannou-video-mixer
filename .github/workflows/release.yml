name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nannou_sketch
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nannou_sketch.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nannou_sketch
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: nannou_sketch
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # FFmpeg is built from source and linked statically (ffmpeg-next `build`).
      - name: FFmpeg build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm libclang-dev
      - name: FFmpeg build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: FFmpeg build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          install: make nasm diffutils
      - name: Build (Windows, inside MSYS2 for FFmpeg's configure)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}
      # The program reads ./shaders at run time: ship it next to the binary.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/
          cp -R shaders dist/shaders
      - uses: actions/upload-artifact@v4
        with:
          name: nannou_sketch-${{ matrix.target }}
          path: dist
