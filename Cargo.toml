[package]
name = "nannou_sketch"
version = "0.1.0"
edition = "2021"

[dependencies]
nannou = "0.19"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded", "decoding"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same wgpu nannou uses; the extra feature lets us hand it a pre-validated naga module.
wgpu_upstream = { package = "wgpu", version = "0.17", features = ["naga"] }
naga = { version = "0.13", features = ["glsl-in", "validate"] }
# WLED controllers' inputs over their JSON API (this repo's own crate).
wled_pots = { path = "wled_pots" }
# Video files. `build` clones FFmpeg and links it statically, so the binary
# is standalone on every target (needs git, make, a C compiler and libclang
# at build time; see README). Only demuxing + decoding + scaling are used.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "build"] }

[profile.release]
opt-level = 3

[dev-dependencies]
pollster = "0.4"

# Camera MJPEG decoding, image resizing etc. are far too slow unoptimized;
# keep our own code debuggable but build dependencies with optimizations.
[profile.dev.package."*"]
opt-level = 3
